name: Build 25.12 Single Machine

# Fix for broken build: https://github.com/softprops/action-gh-release/issues/236
permissions:
  contents: write
  actions: write

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      config_repo:
        description: 'Use json config repo true(1) or false(0) See ReadME'
        required: true
        default: '{"Cache": "1", "CacheSave": "false", "UPLOAD_RELEASE": "1", "ALLKMOD": "1"}'

      MACH:
        description: 'Choose machine'
        required: true
        default: 's20p'
        type: choice
        options:
        - 's20p'
        - 's20p-lite'
        - 'lenovo_newifi-d1'
        - 'd-team_newifi-d2'
        - 'lenovo_newifi-y1'
        - 'raisecom_msg1500'
        - 'domywifi_dw33d'
        - 'ath79_generic-multi'
        - 'lunaticbox'

      SFE_BUILDIN:
        description: 'Build sfe'
        default: 'true'
        type: choice
        options:
        - 'true'
        - 'false'

      patch_repo:
        description: 'Use json patch repo true(1) or false(0) See ReadME'
        required: true
        default: '{"KERNEL66": "1", "TRY_BBR_V3": "1", "BCM_FULLCONE": "1", "Firewall_Allow_WAN": "0", "ADD_IB": "1", "ADD_SDK": "1", "ADD_eBPF": "0", "DOCKER_BUILDIN": "0"}'

      SETIP:
        description: 'Set ip address'
        default: '192.168.7.1'
        required: false
        type: choice
        options:
        - '192.168.6.1'
        - '192.168.7.1'
        - '192.168.8.1'
        - '192.168.8.6'
        - '192.168.8.7'
        - '192.168.8.8'
        - '192.168.8.66'
        - '192.168.9.1'
        - '192.168.10.1'
        - '192.168.11.1'
        - '192.168.12.1'
        - '192.168.16.1'
        - '192.168.17.1'
        - '192.168.17.17'
        - '192.168.17.8'
        - '192.168.17.7'
        - '192.168.17.66'
        - '192.168.17.77'
        - '192.168.18.1'
        - '192.168.19.1'
        - '192.168.20.1'
        - '192.168.22.1'
        - '192.168.33.1'
        - '192.168.66.1'
        - '192.168.67.1'
        - '192.168.77.1'
        - '192.168.78.1'
        - '192.168.87.1'
        - '192.168.88.1'
        - '192.168.89.1'
        - '192.168.96.1'
        - '192.168.99.1'
        - '192.168.100.1'
        - '192.168.110.1'
        - '192.168.120.1'
        - '192.168.160.1'
        - '192.168.166.1'
        - '192.168.167.1'
        - '192.168.177.1'
        - '192.168.188.1'
        - '172.16.0.1'
        - '172.18.0.1'
        - '10.0.0.1'
        - '10.88.0.1'

      packages:
        description: 'OpenWrt packages（example: luci-app-example,luci-app-helloworld）'
        required: true
        default: 'luci-app-mwan-switch,luci-app-example2'
      packages_mod:
        description: 'The Above packages set to which'
        default: 'm'
        type: choice
        options:
        - 'y'
        - 'm'
        - 'n'

env:
  TZ: Asia/Shanghai
  OpenWrt_PATCH_FILE_DIR: openwrt-2512

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      machine: ${{ steps.set-matrix.outputs.machine }}
    env:
      Target_CFG_Machine: ${{ github.event.inputs.MACH || github.event.client_payload.MACH }}
    steps:
      - name: 检查
        uses: actions/checkout@main
      
      - name: 生成矩阵配置
        id: set-matrix
        run: bash "$GITHUB_WORKSPACE/core-2512.sh" resolve-build-matrix
 
  build:
    runs-on: Ubuntu-24.04
    timeout-minutes: 720
    needs: prepare
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: Build ${{ needs.prepare.outputs.machine }} openwrt 25.12
    env:
      Matrix_Target: ${{ matrix.target }}
      Target_CFG_Machine: ${{ needs.prepare.outputs.machine }}

    steps:
    - name: 记录 build job 开始时间
      # 6h 是 build job 的总时限。编译步骤从这里算剩余预算，到 5h55m 主动失败，
      # 留 5 分钟给缓存 post 上传（cancelled 状态下不会保存缓存）。
      run: echo "BUILD_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

    - name: 检查
      uses: actions/checkout@main

    - name: Print matrix from prepare
      run: |
         echo "::notice ::Matrix from prepare: ${{ needs.prepare.outputs.matrix }}"

    - name: 检查服务器配置
      run: |
        echo -e "------------------------------- CPU信息 -------------------------------\n"
        echo "CPU物理数量:$(cat /proc/cpuinfo| grep "physical id"| sort| uniq| wc -l)"
        echo -e "CPU核心及版本信息: $(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
        echo -e "------------------------------- 内存信息 -------------------------------\n"
        echo "已安装内存详细信息: "
        sudo lshw -short -C memory | grep GiB
        echo -e "\n"
        echo -e "------------------------------- 磁盘信息 -------------------------------\n"
        echo -e "磁盘数量: $(ls /dev/sd* | grep -v [1-9] | wc -l) \n"
        echo "------------------------------- 磁盘详情 -------------------------------\n"
        df -Th

    - name: 释放Ubuntu磁盘空间
      uses: endersonmenezes/free-disk-space@v2
      with:
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        remove_tool_cache: true
        remove_swap: true
        remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
        remove_packages_one_command: true
        remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/share/glade* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell"
        testing: false

    - name: 初始化环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        chmod +x gen-sha256sum.sh add-test-packages.sh add-sfe-packages.sh core-2512.sh
        $GITHUB_WORKSPACE/core-2512.sh init-pkg-env

    - name: 设置GITHUB_ENV
      id: env
      env:
        PATCH_JSON_INPUT: ${{ github.event.inputs.patch_repo }}
        CONFIG_JSON_INPUT: ${{ github.event.inputs.config_repo }}
      run: |
        echo ${{matrix.target}}
        $GITHUB_WORKSPACE/core-2512.sh init-gh-env

    - name: 克隆源代码
      working-directory: /workdir
      id: clone
      env:
        OPENWRT_REPO_SSH_KEY: ${{ secrets.OPENWRT_REPO_SSH_KEY }}
      run: |
        df -hT $PWD
        case "$REPO_URL" in
          git@*)
            if [ -z "$OPENWRT_REPO_SSH_KEY" ]; then
              echo "::error::secret OPENWRT_REPO_SSH_KEY 未设置（私有仓库只读 Deploy Key 私钥）"
              exit 1
            fi
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            printf '%s\n' "$OPENWRT_REPO_SSH_KEY" > ~/.ssh/openwrt_repo_key
            chmod 600 ~/.ssh/openwrt_repo_key
            export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/openwrt_repo_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new"
            ;;
        esac
        git clone $REPO_URL -b $REPO_BRANCH openwrt --single-branch
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
        cd openwrt
        sed -i \
          -e 's|https://git.openwrt.org/feed/packages.git;openwrt-25.12|https://github.com/openwrt/packages.git;openwrt-25.12|' \
          -e 's|https://git.openwrt.org/project/luci.git;openwrt-25.12|https://github.com/openwrt/luci.git;openwrt-25.12|' \
          -e 's|https://git.openwrt.org/feed/routing.git;openwrt-25.12|https://github.com/openwrt/routing.git;openwrt-25.12|' \
          -e 's|https://git.openwrt.org/feed/telephony.git;openwrt-25.12|https://github.com/openwrt/telephony.git;openwrt-25.12|' \
          feeds.conf.default
        sed -i '$a src-git lunatic7 https://github.com/lunatickochiya/luna-action-packages.git' feeds.conf.default
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 增加磁盘空间
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        $GITHUB_WORKSPACE/core-2512.sh ln-openwrt

    - name: Patch 自定义
      id: patch
      run: |
        $GITHUB_WORKSPACE/core-2512.sh init-openwrt-patch
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 添加 SFE
      if: github.event.inputs.SFE_BUILDIN == 'true'
      id: sfe
      run: |
        $GITHUB_WORKSPACE/core-2512.sh add-openwrt-sfe-2512
        echo "status=success" >> $GITHUB_OUTPUT
        echo "SFE=_SFE" >> $GITHUB_ENV

    - name: 自定义安装包(优先于feeds)
      if: steps.clone.outputs.status == 'success'
      id: files
      env:
        SFE_INPUT_STATUS: ${{ github.event.inputs.SFE_BUILDIN }}
      run: |
        $GITHUB_WORKSPACE/core-2512.sh add-openwrt-files
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 设置 IP 地址
      if: github.event.inputs.SETIP != '192.168.10.1'
      id: setip
      run: |
        IPSET_VALUE="${{ github.event.inputs.SETIP }}"
        sed -i "s/192\.168\.10\.1/$IPSET_VALUE/g" openwrt/package/kochiya/autoset/files/def_uci/zzz-autoset*
        grep 'set network.lan.ipaddr=' openwrt/package/kochiya/autoset/files/def_uci/zzz-autoset*
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 更新 & 安装 feeds
      if: steps.files.outputs.status == 'success'
      id: feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        (rm -rf feeds/packages/lang/golang && cp -r $GITHUB_WORKSPACE/$OpenWrt_PATCH_FILE_DIR/feeds-packages-replace/* feeds/packages/ && echo "Golang Replaced")
        rm -rf feeds/packages.index
        (cp -r $GITHUB_WORKSPACE/$OpenWrt_PATCH_FILE_DIR/feeds-replace/luci/* feeds/luci/ && echo "luci-lib-docker Re-add")
        rm -rf feeds/luci.index
        ./scripts/feeds update luci packages
        ./scripts/feeds install -a
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 自定义配置（修复feeds）
      if: steps.feeds.outputs.status == 'success'
      id: config
      env:
        INPUT_PKGS_CFG_STATUS: ${{ github.event.inputs.packages_mod }}
        INPUT_PKGS_CFG_FOO: ${{ github.event.inputs.packages }}
      run: |
        $GITHUB_WORKSPACE/core-2512.sh fix-openwrt-feeds
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 添加kmod
      if: steps.config.outputs.status == 'success' && env.ALLKMOD == '1'
      id: config2
      run: |
        $GITHUB_WORKSPACE/core-2512.sh add-openwrt-kmods
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Run awk command
      if: steps.config.outputs.status == 'success'
      working-directory: ./openwrt
      run: |
        $GITHUB_WORKSPACE/core-2512.sh awk-openwrt-config

    - name: 准备宿主工具链（Rust/Go/LLVM/Python）
      if: steps.config.outputs.status == 'success'
      working-directory: ./openwrt
      run: |
        # rust：用 runner 的 rustup 替换 rust/host 源码构建
        bash "$GITHUB_WORKSPACE/.github/scripts/prepare-rust.sh" || \
          echo "::warning ::Rust 注入失败，回退到源码构建"
        # Go / eBPF LLVM / host Python PGO：能用 runner 的就不从源码编
        bash "$GITHUB_WORKSPACE/.github/scripts/prepare-build-host.sh" || \
          echo "::warning ::宿主工具链准备失败，保持 OpenWrt 默认行为"

    - name: 注入编译耗时统计
      if: steps.config.outputs.status == 'success'
      working-directory: ./openwrt
      run: |
        python3 "$GITHUB_WORKSPACE/.github/scripts/patch-build-time-log.py" . \
          --scripts-dir "$GITHUB_WORKSPACE/.github/scripts" || \
          echo "::warning ::编译耗时统计注入失败，跳过报告"

    - name: 下载包文件
      if: steps.config.outputs.status == 'success'
      run: |
        cd openwrt
        make download -j$(nproc)
        find dl -size -1024c -exec rm -f {} \;
        # make download 可能因某个包失败而留下不完整的 kernel 包；
        # 校验 xz/gz，坏文件删掉，让 compile 阶段重新下载，避免 .prepared 解压失败。
        for f in dl/linux-*.tar.xz; do
          [ -e "$f" ] || continue
          if ! xz -t "$f" >/dev/null 2>&1; then
            echo "Removing corrupt kernel tarball: $f"
            rm -f "$f"
          fi
        done
        for f in dl/linux-*.tar.gz; do
          [ -e "$f" ] || continue
          if ! gzip -t "$f" >/dev/null 2>&1; then
            echo "Removing corrupt kernel tarball: $f"
            rm -f "$f"
          fi
        done
        # package download 失败时 target/linux download 可能没跑完；单独重试 kernel 包。
        for attempt in 1 2 3; do
          make target/linux/download -j1 V=s >/tmp/kernel-download.log 2>&1 || true
          bad=0
          for f in dl/linux-*.tar.xz; do
            [ -e "$f" ] || continue
            xz -t "$f" >/dev/null 2>&1 || { bad=1; rm -f "$f"; }
          done
          for f in dl/linux-*.tar.gz; do
            [ -e "$f" ] || continue
            gzip -t "$f" >/dev/null 2>&1 || { bad=1; rm -f "$f"; }
          done
          [ "$bad" = 0 ] && break
          echo "kernel download incomplete (attempt $attempt), retrying..."
          tail -20 /tmp/kernel-download.log || true
          sleep 5
        done

    - name: 缓存staging
      id: cache
      uses: HiGarfield/cachewrtbuild@main
      if: env.Cache == '1' && !cancelled()
      with:
        ccache: 'true'
        mixkey: ${{ matrix.target }}${{ env.eBPF }}${{ env.Branch }}
        prefix: ${{ github.workspace }}/openwrt
        skip_saving: ${{ env.CacheSave }}

    - name: 恢复工具链（Release 兜底）
      # Actions cache 未命中时，从 toolchain-cache Release 下载同 target/同 tools+toolchain
      # hash 的压缩包；没有就退回现场编译，不阻断构建。
      if: env.Cache == '1' && steps.cache.outputs.hit != '1'
      working-directory: ./openwrt
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        command -v zstd >/dev/null || sudo apt-get install -y -qq zstd
        TC_HASH=$(git log --pretty=tformat:"%h" -n1 tools toolchain)
        TC_TARGET="${{ matrix.target }}"
        TC_TARGET="${TC_TARGET%-nftables}"
        TC_SUFFIX="${eBPF:-}"
        ASSET="toolchain-${OpenWrt_PATCH_FILE_DIR}-${TC_TARGET}${TC_SUFFIX}-${TC_HASH}.tar.zst"
        if gh release download toolchain-cache -p "$ASSET" -D /tmp --clobber 2>/dev/null; then
          echo "从 Release 恢复工具链：$ASSET"
          tar --zstd -xf "/tmp/$ASSET" -C .
          sed -i 's/ $(tool.*\/stamp-compile)//;' Makefile
          sed -i 's/ $(tool.*\/stamp-install)//;' Makefile
        else
          echo "::notice ::未找到 $ASSET，本次现场编译工具链"
        fi

    - name: 修正工具链缓存时间戳
      # actions/cache 解压后 mtime 可能早于源码，make 会把 host/tool stamp 判为过期。
      if: (!cancelled())
      working-directory: ./openwrt
      run: |
        if [ -d staging_dir ]; then
          find staging_dir -type d -name stamp -not -path "*target*" -print0 2>/dev/null |
            while IFS= read -r -d '' d; do
              find "$d" -type f -exec touch {} + 2>/dev/null || true
            done
        fi
        mkdir -p tmp
        echo 1 > tmp/.build

    - name: 编译固件
      id: compile
      working-directory: ./openwrt
      env:
        # 6h 是 build job 的总时限；从 build job 开始算，5h55m 必须停止编译，
        # 留 5 分钟给缓存 post 上传。SETUP_MARGIN 用于补偿"job 开始->第一步"的
        # setup 时间（通常十几秒，这里按 60s 保守估算）。
        BUILD_JOB_STOP_SECONDS: '21300'
        CACHE_RESERVE_SECONDS: '300'
        BUILD_JOB_SETUP_MARGIN_SECONDS: '60'
        # 每个包的 prepare/configure/compile/install 起止时间，编译后汇总 Top 30
        BUILD_TIME_LOG: 'build-time.tsv'
        # ccache 上限 6G：太小内核对象会被后续包挤出（内核冷编 40+ 分钟），
        # 太大又会把 runner 磁盘和 10G 缓存配额吃满（曾出现 runner 直接崩溃）。
        CCACHE_MAXSIZE: '6G'
      run: |
        start=${BUILD_JOB_START_EPOCH:-$(date +%s)}
        elapsed=$(( $(date +%s) - start + BUILD_JOB_SETUP_MARGIN_SECONDS ))
        budget=$(( BUILD_JOB_STOP_SECONDS - elapsed ))
        echo "build job 已运行约 ${elapsed}s，本次编译预算 ${budget}s（build job 开始后 5h55m 停止编译，留 5min 存缓存）"
        if [ "$budget" -le 0 ]; then
          echo "::error ::build job 已运行 ${elapsed}s（超过 5h55m 阈值），直接失败以便保存缓存"
          exit 1
        fi
        set +e
        # 磁盘看门狗：剩余低于 6G 时主动终止编译。runner 磁盘被写满会直接崩，
        # 崩溃的 job 连日志/缓存都保不住（之前有 job 的 compile 步骤没有结论、
        # 日志 BlobNotFound）。主动失败至少能保存 compile.log 和 ccache。
        (
          while true; do
            avail=$(df --output=avail -BG / 2>/dev/null | tail -n1 | tr -dc '0-9')
            if [ -n "$avail" ] && [ "$avail" -lt 6 ]; then
              echo "::error ::磁盘剩余仅 ${avail}G，主动终止编译（保存日志/缓存）"
              pkill -TERM -x make 2>/dev/null || true
              sleep 5
              pkill -KILL -x make 2>/dev/null || true
              break
            fi
            sleep 60
          done
        ) &
        disk_watchdog=$!
        # V=1（=V=w）：子 make 以 -s 运行、不回显每条命令（没有 V=s 的降速/海量输出），
        # stdout 照常丢弃，只保留 stderr；把 stderr 写进 openwrt/compile.log，
        # 和本地 `make ... 2> compile.log` 一样是一份几十 KB 的报错日志。
        # CI 日志只有正常进度行（make[N] -C ...）和 time: 行。
        timeout --signal=TERM --kill-after=60s "$budget" \
          bash -c 'make -j$(($(nproc)+1)) V=1' \
          2> >(gawk '{ print strftime("[%H:%M:%S]"), $0; fflush() }' > compile.log)
        rc=$?
        if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ] && [ "$rc" -ne 137 ]; then
          if grep -qE "target/linux failed|target/linux/compile.*Error" compile.log; then
            echo "::warning ::target/linux 失败，重跑 make -j1 V=s target/linux/compile 以获取详细错误"
            timeout 600 make -j1 V=s target/linux/compile 2>&1 | tail -120 | tee -a compile.log || true
          fi
          if grep -qE "package/kernel/linux failed|package/kernel/linux/compile.*Error" compile.log; then
            echo "::warning ::package/kernel/linux 失败，重跑 make -j1 V=s package/kernel/linux/compile 以获取详细错误"
            timeout 600 make -j1 V=s package/kernel/linux/compile 2>&1 | tail -120 | tee -a compile.log || true
          fi
        fi
        kill "$disk_watchdog" 2>/dev/null || true
        sleep 1
        set -e
        if [ "$rc" -ne 0 ]; then
          # 失败时把 compile.log 复制一份到工作区根目录供 artifact 上传。
          cp -f compile.log "$GITHUB_WORKSPACE/compile.log" || true
        fi
        if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
          echo "::error ::编译到达 build job 开始后 5h55m 阈值，主动中断（本次预算 ${budget}s），留 5min 给缓存保存"
          exit 1
        fi
        [ "$rc" -eq 0 ] || exit "$rc"
        # rust 的 sccache 命中率（没有 rust 构建时输出为 0）
        sccache --show-stats 2>/dev/null | head -20 || true
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 生成编译耗时报告
      # 失败也生成，便于判断是哪个包/阶段拖慢或卡住
      if: always()
      continue-on-error: true
      working-directory: ./openwrt
      run: |
        if [ -s build-time.tsv ]; then
          scripts/build-time-report.pl -n 30 build-time.tsv > build-time-report.txt 2>&1 || true
          cp -f build-time-report.txt "$GITHUB_WORKSPACE/build-time-report.txt" || true
          echo "===== 编译耗时 Top 30 ====="
          cat build-time-report.txt || true
        else
          echo "::notice ::没有 build-time.tsv，跳过耗时报告"
        fi

    - name: 上传编译耗时报告
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@main
      with:
        name: build-time-${{ matrix.target }}
        path: build-time-report.txt
        if-no-files-found: ignore
        retention-days: 7

    - name: 上传编译日志
      # 只在失败时上传；compile.log 是编译过程的 stderr（真实报错），通常很小
      if: failure()
      continue-on-error: true
      uses: actions/upload-artifact@main
      with:
        name: compile-log-${{ matrix.target }}
        path: compile.log
        if-no-files-found: ignore
        retention-days: 7

    - name: 检查空间使用情况
      if: (!cancelled())
      run: df -hT

    - name: 上传bin目录
      uses: actions/upload-artifact@main
      continue-on-error: true
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: ${{ env.date3 }}_${{matrix.target}}
        path: |
          openwrt/bin/

    - name: 打包ipk成zip文件
      id: afb
      continue-on-error: true
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        $GITHUB_WORKSPACE/$DIY_SH_AFB
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 整理文件
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && steps.afb.outputs.status == 'success' && !cancelled()
      run: |
        mkdir -p firmware ipks
        [ ${{ env.UPLOAD_RELEASE}} = 1 ] && cp -u -f openwrt/kernelipks.zip firmware
        [ ${{ env.UPLOAD_RELEASE}} = 1 ] && cp -u -f openwrt/ipks.zip firmware
        cp -u -f openwrt/kernelipks.zip ipks
        cp -u -f openwrt/ipks.zip ipks
        mv -f openwrt/bin/targets/*/*/{*combined*,*ext4*,*sdk*,*imagebuilder*,*buildinfo*,*manifest*,*json*,*sha256sums*} ./firmware/ 2>/dev/null || true
        [ $UPLOAD_SYSUPGRADE = true ] && mv -f openwrt/bin/targets/*/*/{*combined*,*sysupgrade*,*openwrt*,*initramfs*,*factory*} ./firmware/ 2>/dev/null || true
        cp openwrt/.config  ./firmware/${{matrix.target}}.config
        cp openwrt/build_dir/target-*/linux-*/linux-*/.config ./firmware/${{matrix.target}}_kernel.config
        cd firmware
        echo "v${{ env.date2 }}" > version.txt
        echo ${{matrix.target}} >> version.txt
        rm -rf sha256sums
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传firmware目录
      uses: actions/upload-artifact@main
      continue-on-error: true
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
      with:
        name: ${{ env.date3 }}_${{matrix.target}}_firmware_25.12-${{ env.Target_CFG_Machine }}-${{ github.event.inputs.SETIP }}${{ env.Kernel_Test }}${{ env.KERNEL66_NAME }}${{ env.BCM_FULLCONE_NAME }}${{ env.SFE }}${{ env.TRY_BBR_V3_NAME }}${{ env.OPENSSL_3_5_NAME }}${{ env.DOCKER_NAME }}${{ env.WAN_NAME }}${{ env.MAC80211_616_NAME }}${{ env.eBPF }}
        path: |
          firmware

    - name: 上传软件包目录
      uses: actions/upload-artifact@main
      continue-on-error: true
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_IPK_DIR == 'true' && steps.afb.outputs.status == 'success'
      with:
        name: ${{ env.date3 }}_${{matrix.target}}_packages_25.12-${{ env.Target_CFG_Machine }}${{ env.Kernel_Test }}${{ env.KERNEL66_NAME }}${{ env.BCM_FULLCONE_NAME }}${{ env.SFE }}${{ env.TRY_BBR_V3_NAME }}${{ env.OPENSSL_3_5_NAME }}${{ env.DOCKER_NAME }}${{ env.WAN_NAME }}${{ env.MAC80211_616_NAME }}${{ env.eBPF }}
        path: |
          ipks

    - name: 上传固件cowtransfer
      id: cowtransfer
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_COWTRANSFER == 'true' && !cancelled()
      run: |
        curl -fsSL git.io/file-transfer | sh
        ./transfer cow --block 2621440 -s -p 64 --no-progress ${FIRMWARE} 2>&1 | tee cowtransfer.log
        echo "::warning file=cowtransfer.com::$(cat cowtransfer.log | grep https)"
        echo "url=$(cat cowtransfer.log | grep https | cut -f3 -d" ")" >> $GITHUB_OUTPUT

    - name: 上传固件WeTransfer
      id: wetransfer
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_WETRANSFER == 'true' && !cancelled()
      run: |
        curl -fsSL git.io/file-transfer | sh
        ./transfer wet -s -p 16 --no-progress ${FIRMWARE} 2>&1 | tee wetransfer.log
        echo "::warning file=wetransfer.com::$(cat wetransfer.log | grep https)"
        echo "url=$(cat wetransfer.log | grep https | cut -f3 -d" ")" >> $GITHUB_OUTPUT

    - name: 生成发布标签
      id: tag
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == '1' && !cancelled()
      run: |
        touch release.txt
        $GITHUB_WORKSPACE/gen-sha256sum.sh
        echo "# 当前固件IP地址："${{ github.event.inputs.SETIP }}" " >> release.txt
        [ ${{matrix.target}} = mt798x* ] && [ -e openwrt/target/linux/mediatek/filogic/base-files/lib/firmware/mediatek/nx30pro_eeprom.bin ] && echo "- eeprom 使用 H3C NX30 Pro 提取版本" >> release.txt
        [ "${{ env.Target_CFG_Machine }}" = rax3000m-emmc ] && echo "- 使用闪存频率: ($(grep -oP "max-frequency = <\K[0-9]*" openwrt/target/linux/mediatek/dts/mt7981b-cmcc-rax3000m-emmc-ubootmod.dts)) Hz" >> release.txt
        [ $UPLOAD_COWTRANSFER = true ] && echo "🔗 [Cowtransfer](${{ steps.cowtransfer.outputs.url }})" >> release.txt
        [ $UPLOAD_WETRANSFER = true ] && echo "🔗 [WeTransfer](${{ steps.wetransfer.outputs.url }})" >> release.txt
        echo "🔗 ${{ env.BCM_FULLCONE_NAME }}${{ env.SFE }}${{ env.TRY_BBR_V3_NAME }}${{ env.OPENSSL_3_5_NAME }}" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传固件发布
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: "${{ env.FIRMWARE }}/*"
        name: ${{ env.date }} ${{matrix.target}}-${{ env.Target_CFG_Machine }}-openwrt-2512
        tag_name: ${{ env.date }}_${{matrix.target}}-${{ env.Target_CFG_Machine }}-openwrt-2512
        body_path: release.txt

    - name: 删除工作流
      uses: Mattraks/delete-workflow-runs@main
      continue-on-error: true
      with:
        retain_days: 10
        keep_minimum_runs: 20

    - name: 删除旧版本
      uses: dev-drprasad/delete-older-releases@master
      if: env.UPLOAD_RELEASE == '1' && !cancelled()
      continue-on-error: true
      with:
        keep_latest: 99
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
