        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: |
            staging_dir/host*
            staging_dir/tool*
            .ccache
          key: ath79-nftables_eBPF
          restore-keys: ath79-nftables_eBPF
          lookup-only: true

      - name: Touch ath79-nftables
        id: ath79_nftables
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: |
            staging_dir/host*
            staging_dir/tool*
            .ccache
          key: ath79-nftables
          restore-keys: ath79-nftables
          lookup-only: true

      - name: Touch mt798x-iptables_eBPF
        id: mt798x_iptables_ebpf
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: |
            staging_dir/host*
