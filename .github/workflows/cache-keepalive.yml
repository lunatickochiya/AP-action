name: Keep Cache Alive

# actions/cache 的条目 7 天不访问会被回收。
# cachewrtbuild 生成的缓存 key 形如：
#   <target><eBPF><Branch>-cache-openwrt-<toolchain-hash>-<timestamp>
# 每 5 天用 lookup-only（只查询不下载）触碰各 target 的最近缓存，
# 保证常用机型不用每次重编工具链。
# 注意：缓存匹配是 (key, version)，version 由 path 计算（sha256(paths+压缩+盐)）。
# path 必须与 cachewrtbuild 保存时完全一致：staging_dir/host*、staging_dir/tool*、
# .ccache（ccache: 'true'），否则 restore-keys 前缀再对也永远 miss。
# 参考：qwe3017/Actions-OpenWrt-AN758X/.github/workflows/cache-keepalive.yml
on:
  schedule:
    - cron: '0 0 */5 * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Touch ar71xx-iptables_eBPF
        id: ar71xx_iptables_ebpf
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: |
            staging_dir/host*
            staging_dir/tool*
            .ccache
          key: ar71xx-iptables_eBPF
          restore-keys: ar71xx-iptables_eBPF
          lookup-only: true

      - name: Touch ar71xx-iptables
        id: ar71xx_iptables
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: |
            staging_dir/host*
            staging_dir/tool*
            .ccache
          key: ar71xx-iptables
          restore-keys: ar71xx-iptables
          lookup-only: true

      - name: Touch ath79-iptables_eBPF
        id: ath79_iptables_ebpf
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: |
            staging_dir/host*
            staging_dir/tool*
            .ccache
          key: ath79-iptables_eBPF
          restore-keys: ath79-iptables_eBPF
          lookup-only: true

      - name: Touch ath79-iptables
        id: ath79_iptables
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: |
            staging_dir/host*
            staging_dir/tool*
            .ccache
          key: ath79-iptables
          restore-keys: ath79-iptables
          lookup-only: true

      - name: Touch ath79-nftables_eBPF
